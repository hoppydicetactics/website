name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      HUGO_VERSION: 0.164.0
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Replace email address placeholder
        env:
          HUGO_OWNER_EMAIL: ${{ secrets.HUGO_OWNER_EMAIL }}
        run: |
          sed -i "s/REPLACEME_EMAIL/$EMAIL_ADDRESS/g" content/{de,en}/events.md
          sed -i "s/REPLACEME_OWNER_EMAIL/$HUGO_OWNER_EMAIL/g" layouts/shortcodes/legally-ok.html

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_OWNER_CITY: ${{ secrets.HUGO_OWNER_CITY }}
          HUGO_OWNER_PHONE: ${{ secrets.HUGO_OWNER_PHONE }}
          HUGO_OWNER_STREET: ${{ secrets.HUGO_OWNER_STREET }}
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"          

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
